<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b1020">
<title>Voice Interpreter</title>
<style>
  :root {
    --bg: #0b1020;
    --panel: #141a2e;
    --card: #1b2340;
    --ink: #eef2ff;
    --muted: #93a0c2;
    --line: #2a3558;
    --blue: #4f8cff;
    --red: #ff5a6a;
    --green: #3dcc8c;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif;
  }
  body {
    display: flex; flex-direction: column;
    min-height: 100vh; min-height: 100dvh;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header h1 { margin: 0; font-size: 16px; font-weight: 650; letter-spacing: .2px; }
  .row { display: flex; align-items: center; gap: 8px; }
  select, input, button.ghost {
    background: var(--bg); color: var(--ink);
    border: 1px solid var(--line); border-radius: 10px;
    padding: 8px 10px; font: inherit; font-size: 13px;
  }
  button.ghost { cursor: pointer; }
  main {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px 12px; gap: 14px; overflow: hidden;
  }
  #mic {
    width: min(220px, 62vw); height: min(220px, 62vw);
    border: 0; border-radius: 50%;
    background: radial-gradient(circle at 30% 25%, #7ab0ff, var(--blue) 42%, #2a5bd7);
    color: #fff; font-size: 22px; font-weight: 750;
    box-shadow: 0 16px 40px rgba(79,140,255,.35);
    cursor: pointer;
  }
  #mic.live {
    background: radial-gradient(circle at 30% 25%, #ff8a94, var(--red) 48%, #b42333);
    box-shadow: 0 16px 40px rgba(255,90,106,.4);
    animation: pulse 1.3s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.03); }
  }
  #status { color: var(--muted); font-size: 13px; min-height: 18px; text-align: center; }
  #log {
    width: 100%; max-width: 560px; flex: 1; overflow-y: auto;
    -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; gap: 8px;
  }
  .bubble {
    border-radius: 14px; padding: 10px 12px; background: var(--card);
    border: 1px solid var(--line); font-size: 14px; line-height: 1.45;
  }
  .bubble.you { background: #1a2238; }
  .bubble.bot { background: #16284a; }
  .who { font-size: 11px; letter-spacing: .6px; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
  .zh { font-size: 16px; }
  .py { color: #b7c4e6; font-style: italic; font-size: 13px; }
  .en { color: #dbe4ff; }
  .hint { color: var(--muted); text-align: center; font-size: 13px; padding: 24px 8px; }
  footer {
    padding: 8px 16px 12px; color: var(--muted); font-size: 11px; text-align: center;
    border-top: 1px solid var(--line);
  }
  #panel {
    display: none; width: 100%; max-width: 560px;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 16px; padding: 14px;
  }
  #panel.open { display: block; }
  #panel h2 { margin: 0 0 8px; font-size: 16px; }
  #panel label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
  #panel input { width: 100%; }
  #panel p { font-size: 12px; color: var(--muted); line-height: 1.4; margin: 0 0 8px; }
  .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
</style>
<script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.19.7/dist/index.js"></script>
</head>
<body>
  <header>
    <h1>Voice Interpreter</h1>
    <div class="row">
      <select id="lock" aria-label="Output language">
        <option value="auto">Output: Auto</option>
        <option value="zh">Lock Chinese</option>
        <option value="en">Lock English</option>
      </select>
      <button class="ghost" id="settings" type="button">API Key</button>
    </div>
  </header>
  <main>
    <button id="mic" type="button">Start Voice</button>
    <button class="ghost" id="settings2" type="button" style="font-size:15px;padding:10px 16px">Set API Key</button>
    <div id="panel">
      <h2>API key</h2>
      <p>Leave this blank to use free translation. A key is only for Answer mode.</p>
      <label for="endpoint">Endpoint</label>
      <input id="endpoint" placeholder="https://api.openai.com/v1/chat/completions">
      <label for="model">Model</label>
      <input id="model" placeholder="gpt-4o-mini">
      <label for="apikey">API key</label>
      <input id="apikey" type="password" autocomplete="off" placeholder="sk-…">
      <div class="actions">
        <button class="ghost" id="cancelKey" type="button">Hide</button>
        <button class="ghost" id="saveKey" type="button">Save</button>
      </div>
    </div>
    <div id="status">Tap Start Voice. No API key needed for translate.</div>
    <div id="log"><div class="hint">Said and translated lines will show here.</div></div>
  </main>
  <footer>English ↔ Chinese · best in Chrome. Say stop or 停 to end.</footer>
